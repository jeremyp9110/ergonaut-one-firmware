# ==========================================
# 1. ACTIVATION DU MATÉRIEL
# ==========================================
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y

# ==========================================
# 2. CONFIGURATION MÉMOIRE & GRAPHIQUE (LVGL)
# ==========================================
# Alloue suffisamment de mémoire vidéo pour un écran couleur
CONFIG_LV_Z_VDB_SIZE=50
CONFIG_LV_Z_MEM_POOL_SIZE=10000

# Augmente la pile du thread d'affichage pour éviter les crashs silencieux
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# Active les composants graphiques basiques dont Prospector a besoin
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_COLOR_SCREEN_TRANSP=y

# ==========================================
# 3. CONFIGURATION PROSPECTOR
# ==========================================
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=y
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
