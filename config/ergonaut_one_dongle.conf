# Active l'interface utilisateur de Prospector
CONFIG_PROSPECTOR_STATUS_SCREEN=y

# Style d'écran (Classic par défaut, tu peux en choisir un autre)
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Gestion de la luminosité (fixe, car tu n'as pas de capteur de lumière)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Désactive le capteur de batterie si tu n'en as pas (ou garde-le si branché)
# CONFIG_PROSPECTOR_USE_BATTERY=n

# Pour afficher les noms de calques en majuscules
# CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=y
