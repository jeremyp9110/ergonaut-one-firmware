# Choisir le layout (OPERATOR comme tu l'as défini)
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Désactiver le capteur de lumière ambiante (tu n'en as pas)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n

# Luminosité fixe (1 à 100)
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# (Optionnel) Rotation à 180° si nécessaire
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Mettre les noms de calques en majuscules
CONFIG_PROSPECTOR_LAYER_NAME_UPPERCASE=y

# Active les logs de débogage pour diagnostiquer l'écran
CONFIG_LOG=y
CONFIG_ST7789V_LOG_LEVEL_DBG=4
CONFIG_ZMK_DISPLAY_LOG_LEVEL_DBG=4
CONFIG_PROSPECTOR_LOG_LEVEL_DBG=4
