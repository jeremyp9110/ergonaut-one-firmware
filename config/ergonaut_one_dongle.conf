# ==========================================
# CONFIGURATION DU DONGLE (Rôle Central)
# ==========================================
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Augmentation des slots Bluetooth pour gérer les moitiés + les profils PC
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Gestion de l'alimentation
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Communication USB et Bluetooth
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Optionnel : Activer ZMK Studio sur le dongle
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
