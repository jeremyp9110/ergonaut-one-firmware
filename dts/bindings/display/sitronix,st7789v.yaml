description: Binding personnalisé ST7789V sur bus SPI direct

compatible: "zmk,st7789v"

include: [display-controller.yaml, spi-device.yaml]

properties:
  cmd-data-gpios:
    type: phandle-array
    required: true
    description: Broche GPIO Commande/Data (DC)

  reset-gpios:
    type: phandle-array
    description: Broche GPIO de Réinitialisation

  width:
    type: int
    required: true

  height:
    type: int
    required: true

  x-offset:
    type: int

  y-offset:
    type: int

  vcom:
    type: int

  gctrl:
    type: int

  vrhs:
    type: int

  vdvs:
    type: int

  mdac:
    type: int

  gamma:
    type: int

  colmod:
    type: int

  lcm:
    type: int

  porch-param:
    type: uint8-array

  cmd2en-param:
    type: uint8-array

  pwctrl1-param:
    type: uint8-array

  pvgam-param:
    type: uint8-array

  nvgam-param:
    type: uint8-array

  ram-param:
    type: uint8-array

  rgb-param:
    type: uint8-array
