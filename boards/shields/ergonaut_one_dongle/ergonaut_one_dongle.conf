# Configuration du Dongle ZMK (Active automatiquement le rôle BLE central)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Activation de l'affichage
CONFIG_DISPLAY=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
# Désactivation des capteurs non présent matériellement
CONFIG_SENSOR=n
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# Correctif pour le symbole MIPI DBI manquant lors de la compilation C
CONFIG_COMPILER_OPT="-DDT_N_S_soc_S_spi_40004000_S_st7789_0_P_mipi_mode_STRING_UPPER_TOKEN=MIPI_DBI_MODE_SPI_4WIRE"
