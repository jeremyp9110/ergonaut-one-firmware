# Configuration du Dongle ZMK (Active le rôle BLE central)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Activation de l'affichage et de l'écran
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y

# Activation du rétroéclairage simple (GPIO)
CONFIG_LED=y
CONFIG_ZMK_BACKLIGHT=y

# Correctif pour l'écran SPI
CONFIG_COMPILER_OPT="-DDT_N_S_soc_S_spi_40004000_S_st7789_0_P_mipi_mode_STRING_UPPER_TOKEN=MIPI_DBI_MODE_SPI_4WIRE"
